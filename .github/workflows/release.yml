name: Release

# Push a tag like v0.2.0 or trigger via workflow_dispatch to publish a GitHub release.
#
# Signing: add repository secrets ONETAKE_KEYSTORE_BASE64 (base64 of the .jks), ONETAKE_KEYSTORE_PASSWORD,
# ONETAKE_KEY_ALIAS and ONETAKE_KEY_PASSWORD to get a signed, R8-shrunk release APK and an AAB for
# Google Play. Without them the release carries a minified APK and an installable debug APK.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'
      draft:
        description: 'Publish as draft'
        type: boolean
        default: false
      prerelease:
        description: 'Publish as prerelease'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          if [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ONETAKE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/onetake.jks"
            echo "path=$RUNNER_TEMP/onetake.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release artifacts
        env:
          ONETAKE_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ONETAKE_KEYSTORE_PASSWORD: ${{ secrets.ONETAKE_KEYSTORE_PASSWORD }}
          ONETAKE_KEY_ALIAS: ${{ secrets.ONETAKE_KEY_ALIAS }}
          ONETAKE_KEY_PASSWORD: ${{ secrets.ONETAKE_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          TAG="${{ steps.vars.outputs.tag }}"
          if [ -n "$ONETAKE_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease bundleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "dist/OneTake-$TAG.apk"
            cp app/build/outputs/bundle/release/app-release.aab "dist/OneTake-$TAG.aab"
          else
            echo "::warning::No signing key in repository secrets; building release and debug artifacts."
            ./gradlew assembleRelease assembleDebug --stacktrace
            if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
              cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/OneTake-$TAG-unsigned.apk"
            fi
            if [ -f app/build/outputs/apk/release/app-release.apk ]; then
              cp app/build/outputs/apk/release/app-release.apk "dist/OneTake-$TAG.apk"
            fi
            cp app/build/outputs/apk/debug/app-debug.apk "dist/OneTake-$TAG-debug.apk"
          fi
          cd dist
          sha256sum * > SHA256SUMS.txt || shasum -a 256 * > SHA256SUMS.txt || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: OneTake ${{ steps.vars.outputs.tag }}
          files: dist/*
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
