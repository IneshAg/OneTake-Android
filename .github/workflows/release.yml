name: Release

# Push a tag like v0.2.0 to publish a GitHub release. The version name and code come from the tag.
#
# Signing: add repository secrets ONETAKE_KEYSTORE_BASE64 (base64 of the .jks), ONETAKE_KEYSTORE_PASSWORD,
# ONETAKE_KEY_ALIAS and ONETAKE_KEY_PASSWORD to get a signed, R8-shrunk release APK and an AAB for
# Google Play. Without them the release carries a debug-signed APK, which installs but can't go
# to the Play Store.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ONETAKE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/onetake.jks"
            echo "path=$RUNNER_TEMP/onetake.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VERSION_NAME: ${{ github.ref_name }}
          ONETAKE_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ONETAKE_KEYSTORE_PASSWORD: ${{ secrets.ONETAKE_KEYSTORE_PASSWORD }}
          ONETAKE_KEY_ALIAS: ${{ secrets.ONETAKE_KEY_ALIAS }}
          ONETAKE_KEY_PASSWORD: ${{ secrets.ONETAKE_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ -n "$ONETAKE_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease bundleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "dist/OneTake-$GITHUB_REF_NAME.apk"
            cp app/build/outputs/bundle/release/app-release.aab "dist/OneTake-$GITHUB_REF_NAME.aab"
          else
            echo "::warning::No signing key in repository secrets; publishing a debug-signed APK."
            ./gradlew assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "dist/OneTake-$GITHUB_REF_NAME-debug.apk"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
